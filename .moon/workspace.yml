# Configures all projects within the workspace to create a project graph.
# Accepts a list of globs, a mapping of projects to relative file paths,
# or both values.
projects:
  root: '.'

  # Applications
  api-data: 'applications/api_data_processing'
  api-deployment: 'applications/api_model_deployment'
  api-training: 'applications/api_model_training'
  frontend: 'applications/frontend_demo'
  
  # Shared / Domain code
  domain: 'domain'
  infrastructure: 'infrastructure'

# Configures the version control system (VCS). Also known as
# source code management (SCM).
vcs:
  # The default branch / base.
  defaultBranch: "feat/implement-smart-build-system-moon"

  # The upstream version control provider, where the repository
  # source code is stored.
  # @since 1.8.0
  # @values "bitbucket" | "bitbucket-legacy" | "github" | "gitlab" | "other"
  provider: "github"

